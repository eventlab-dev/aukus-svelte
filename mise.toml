[tools]
node = "22"

[settings]
# This must be enabled to make the hooks work
experimental = true

[hooks]
# Enabling corepack will install the `pnpm` package manager specified in your package.json
# alternatively, you can also install `pnpm` with mise
postinstall = 'corepack enable pnpm && corepack use pnpm@latest-10'

[tasks]
[tasks.start-dev]
description = "Start development server"
run = "pnpm run dev --open --port 8381"

[tasks.gen-api]
description = "Generate api code & types"
run = "pnpm run gen-api"

[tasks.install]
description = "Install all Python dependencies into the venv"
run = "pnpm i"
